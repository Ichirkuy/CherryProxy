<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tic Tac Toe</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #eee; font-family: sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
  .board { display: grid; grid-template-columns: repeat(3, 90px); gap: 6px; }
  .cell { width: 90px; height: 90px; font-size: 2.5rem; background: #222; color: #eee;
          border: none; border-radius: 8px; cursor: pointer; }
  .cell:hover { background: #2d2d2d; }
  button.reset { padding: 8px 18px; border: none; border-radius: 6px; background: #7c5cff; color: #fff; cursor: pointer; }
</style>
</head>
<body>
<div id="status">X's turn</div>
<div class="board" id="board"></div>
<button class="reset" id="reset">Restart</button>
<script>
  const boardEl = document.getElementById("board");
  const statusEl = document.getElementById("status");
  const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  let board, turn, over;

  function start() {
    board = Array(9).fill("");
    turn = "X";
    over = false;
    statusEl.textContent = "X's turn";
    render();
  }

  function render() {
    boardEl.innerHTML = "";
    board.forEach((v, i) => {
      const b = document.createElement("button");
      b.className = "cell";
      b.textContent = v;
      b.onclick = () => play(i);
      boardEl.appendChild(b);
    });
  }

  function play(i) {
    if (over || board[i]) return;
    board[i] = turn;
    const won = lines.some(l => l.every(j => board[j] === turn));
    if (won) { statusEl.textContent = turn + " wins!"; over = true; }
    else if (board.every(Boolean)) { statusEl.textContent = "Draw!"; over = true; }
    else { turn = turn === "X" ? "O" : "X"; statusEl.textContent = turn + "'s turn"; }
    render();
  }

  document.getElementById("reset").onclick = start;
  start();
</script>
</body>
</html>
