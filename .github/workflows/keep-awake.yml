# Visits the site every 10 minutes so Render's free plan never puts it to sleep
# (it sleeps after 15 minutes without visitors). GitHub may run this a few minutes late.
name: Keep CherryProxy awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the site
        # Retries cover the ~1 minute Render takes if the site did fall asleep
        run: >
          curl --silent --show-error --fail --max-time 90
          --retry 5 --retry-delay 15 --retry-all-errors
          -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n"
          https://cherryproxy.onrender.com/
